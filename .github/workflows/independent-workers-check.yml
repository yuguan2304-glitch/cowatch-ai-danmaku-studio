name: Independent Workers Check
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
      - run: bun install --no-save
      - run: bun run build
      - run: bunx tsc --noEmit
      - name: Check Workers bundle
        run: |
          find dist .output -maxdepth 3 -type f 2>/dev/null | head -35 || true
          bunx wrangler deploy --dry-run

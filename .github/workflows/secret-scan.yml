name: Secret Scan

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan git history for credentials
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
          GITLEAKS_ENABLE_SUMMARY: 'false'
      - name: Scan all reachable git history (not just this PR)
        shell: bash
        run: |
          SCANNER=$(find /tmp/gitleaks-* -maxdepth 2 -type f -name gitleaks -perm -u+x | head -n 1)
          test -n "$SCANNER" || { echo "Gitleaks scanner missing"; exit 1; }
          "$SCANNER" git --redact --log-opts="--all" .

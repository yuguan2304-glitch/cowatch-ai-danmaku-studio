name: Deploy CoWatch to Cloudflare Workers
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'bun.lock'
      - 'vite.config.*'
      - 'wrangler.jsonc'
      - '.github/workflows/deploy-cloudflare.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: cowatch-internal
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --no-save
      - name: Build website
        env:
          VITE_COWATCH_SUPABASE_URL: ${{ vars.COWATCH_SUPABASE_URL }}
          VITE_COWATCH_SUPABASE_PUBLISHABLE_KEY: ${{ vars.COWATCH_SUPABASE_PUBLISHABLE_KEY }}
        run: bun run build
      - name: TypeScript check
        run: bunx tsc --noEmit
      - name: Initialize D1 sync database
        run: bunx wrangler d1 execute cowatch-sync --remote --file=cloudflare/migrations/0001_sync.sql --yes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy to Cloudflare
        run: bunx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

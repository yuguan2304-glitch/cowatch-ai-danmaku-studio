name: Android CoWatch APK

on:
  pull_request:
    paths:
      - 'android/**'
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'bun.lock'
      - 'vite.config.ts'
      - '.github/workflows/android-apk.yml'
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'bun.lock'
      - 'vite.config.ts'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Ensure Android SDK platform
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: oven-sh/setup-bun@v2
      - name: Build offline CoWatch web interface
        run: |
          bun install --no-save
          bun run build
          mkdir -p android/app/src/main/assets
          cp -a dist/. android/app/src/main/assets/
          test -f android/app/src/main/assets/index.html
      - name: Build original online Android APK
        run: gradle -p android :app:assembleDebug --no-daemon --stacktrace
      - name: Preserve original installer
        run: cp android/app/build/outputs/apk/debug/app-debug.apk cowatch-android-alpha.apk
      - name: Build separate bundled Alpha preview APK
        run: gradle -p android :app:assembleDebug -PcowatchOffline=true --no-daemon --stacktrace
      - name: Preserve Alpha preview installer
        run: cp android/app/build/outputs/apk/debug/app-debug.apk cowatch-android-alpha-preview.apk
      - name: Upload both APKs
        uses: actions/upload-artifact@v4
        with:
          name: CoWatch-Android-APK
          path: |
            cowatch-android-alpha.apk
            cowatch-android-alpha-preview.apk
          retention-days: 30
      - name: Publish prerelease for easy download
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "android-alpha-${{ github.run_number }}" \
            cowatch-android-alpha.apk \
            cowatch-android-alpha-preview.apk \
            --title "共映 Android 测试版 #${{ github.run_number }}" \
            --notes "包含原始在线 APK 和单独安装的 Alpha 预览测试 APK（文件名含 alpha-preview）；后者内置网页界面，不需访问 workers.dev 即可启动，但 AI API 仍需网络。两个版本数据互不自动同步；请勿卸载旧版以免丢失收藏。调试签名仅供测试。" \
            --prerelease \
            --target "${{ github.sha }}"

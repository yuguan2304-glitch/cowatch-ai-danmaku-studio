name: Android CoWatch APK

on:
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Ensure Android SDK platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build Android test APK
        run: gradle -p android :app:assembleDebug --no-daemon --stacktrace
      - name: Prepare test installer
        run: cp android/app/build/outputs/apk/debug/app-debug.apk cowatch-android-alpha.apk
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: CoWatch-Android-APK
          path: cowatch-android-alpha.apk
          retention-days: 30
      - name: Publish prerelease for easy download
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "android-alpha-${{ github.run_number }}" \
            cowatch-android-alpha.apk \
            --title "共映 Android 测试版 #${{ github.run_number }}" \
            --notes "共映安卓测试版。视频、AI 弹幕和评论仍由线上共映网页提供，需联网。横屏观影时由原生 App 接管系统状态栏和导航栏。此为 GitHub Actions 临时调试签名 APK，后续更新可能需要卸载旧版。" \
            --prerelease \
            --target "${{ github.sha }}"

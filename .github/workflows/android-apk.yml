name: Android CoWatch APK

on:
  pull_request:
    paths:
      - 'android/**'
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'bun.lock'
      - 'vite.config.ts'
      - '.github/workflows/android-apk.yml'
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'bun.lock'
      - 'vite.config.ts'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Ensure Android SDK platform
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: oven-sh/setup-bun@v2
      - name: Build offline CoWatch web interface
        env:
          VITE_COWATCH_SUPABASE_URL: ${{ vars.COWATCH_SUPABASE_URL }}
          VITE_COWATCH_SUPABASE_PUBLISHABLE_KEY: ${{ vars.COWATCH_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          bun install --no-save
          bun run build
          mkdir -p android/app/src/main/assets
          cp -a dist/. android/app/src/main/assets/
          test -f android/app/src/main/assets/index.html
          printf '{"platform":"android","build":%s,"package":"dev.cowatch.player.alpha.autoupdate"}' '${{ github.run_number }}' > android/app/src/main/assets/cowatch-build.json
          test -f android/app/src/main/assets/cowatch-build.json
      # Keep the debug signing key stable across Alpha rebuilds. This avoids
      # Android signature mismatch on future upgrades of the safe-test package.
      - name: Restore stable Alpha debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: cowatch-alpha-safe2026-debug-signing-v1
      - name: Ensure stable debug signing key exists
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -s "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" \
              -storepass android -alias androiddebugkey -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          fi
      - name: Verify restored signing keystore identity
        run: |
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey |
            grep 'SHA256:'
      - name: Build original online Android APK
        env:
          COWATCH_VERSION_CODE: ${{ github.run_number }}
        run: gradle -p android :app:assembleDebug --no-daemon --stacktrace
      - name: Preserve original installer
        run: cp android/app/build/outputs/apk/debug/app-debug.apk cowatch-android-alpha.apk
      - name: Rebuild independently with fresh outputs for Alpha
        # Gradle can otherwise reuse the preceding debug APK even when a
        # property changes, silently producing the wrong applicationId.
        env:
          COWATCH_VERSION_CODE: ${{ github.run_number }}
        run: |
          gradle -p android :app:clean --no-daemon
          gradle -p android :app:assembleDebug -PcowatchOffline=true --no-daemon --stacktrace
      - name: Preserve Alpha preview installer
        run: cp android/app/build/outputs/apk/debug/app-debug.apk cowatch-android-alpha-preview.apk
      - name: Verify actual APK package identity and signing
        run: |
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          SIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$AAPT" dump badging cowatch-android-alpha.apk | grep "^package: name='dev.cowatch.player' "
          "$AAPT" dump badging cowatch-android-alpha-preview.apk | grep "^package: name='dev.cowatch.player.alpha.autoupdate' "
          "$SIGNER" verify --verbose --print-certs cowatch-android-alpha-preview.apk | grep -E 'Verified using|Signer #1 certificate SHA-256 digest'
          EXPECTED=$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | sed -n 's/.*SHA256: //p' | head -1 | tr -d ':' | tr '[:upper:]' '[:lower:]')
          ACTUAL=$("$SIGNER" verify --print-certs cowatch-android-alpha-preview.apk | sed -n 's/.*Signer #1 certificate SHA-256 digest: //p' | head -1)
          test -n "$EXPECTED" && test "$EXPECTED" = "$ACTUAL" || { echo "FAILED: APK did not use cached signing keystore"; exit 1; }
          test "$ACTUAL" = "8bdf54e23b9bc0d7321b63ca6786d6d3abea005bed76e47ed436e875527dbe9c" || { echo "FAILED: signing certificate changed; refusing to publish an unupgradable APK"; exit 1; }
          echo "PASS: APK identity and signing match the restored keystore"
      - name: Upload both APKs
        uses: actions/upload-artifact@v4
        with:
          name: CoWatch-Android-APK
          path: |
            cowatch-android-alpha.apk
            cowatch-android-alpha-preview.apk
          retention-days: 30
      - name: Publish prerelease for easy download
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "android-alpha-${{ github.run_number }}" \
            cowatch-android-alpha.apk \
            cowatch-android-alpha-preview.apk \
            --title "共映 Android 测试版 #${{ github.run_number }}" \
            --notes "包含原始在线 APK 和单独安装的 Alpha 预览测试 APK（文件名含 alpha-preview）；已验证 APK 实际安装包名。安全测试 APK 使用独立包名 dev.cowatch.player.alpha.autoupdate，可与旧 Alpha 并列安装，不覆盖原数据；使用硬性锁定的更新签名；未来包名和证书不变，可在共映里检查更新并确认安装。内置网页界面，不需访问 workers.dev 即可启动，但 AI API 仍需网络。两个版本数据互不自动同步；请勿卸载旧版以免丢失收藏。调试签名仅供测试。" \
            --prerelease \
            --target "${{ github.sha }}"

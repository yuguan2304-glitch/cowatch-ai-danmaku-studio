plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.cowatch.player'
    compileSdk 35

    def offlineBundle = project.hasProperty('cowatchOffline') && project.property('cowatchOffline') == 'true'

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId offlineBundle ? 'dev.cowatch.player.offline' : 'dev.cowatch.player'
        buildConfigField 'boolean', 'OFFLINE_BUNDLE', offlineBundle ? 'true' : 'false'
        resValue 'string', 'cowatch_app_name', offlineBundle ? '共映 离线版' : '共映 CoWatch'
        minSdk 26
        targetSdk 34
        versionCode Integer.parseInt(System.getenv('COWATCH_VERSION_CODE') ?: '1')
        versionName System.getenv('COWATCH_VERSION_NAME') ?: '0.1.0-alpha'
    }

    // Production signing is only configured inside a protected GitHub Action.
    // The keystore and passwords must never be committed or printed in logs.
    if (System.getenv('COWATCH_KEYSTORE_PATH') &&
        System.getenv('COWATCH_KEYSTORE_PASSWORD') &&
        System.getenv('COWATCH_KEY_ALIAS') &&
        System.getenv('COWATCH_KEY_PASSWORD')) {
        signingConfigs {
            release {
                storeFile file(System.getenv('COWATCH_KEYSTORE_PATH'))
                storePassword System.getenv('COWATCH_KEYSTORE_PASSWORD')
                keyAlias System.getenv('COWATCH_KEY_ALIAS')
                keyPassword System.getenv('COWATCH_KEY_PASSWORD')
            }
        }
        buildTypes {
            release {
                signingConfig signingConfigs.release
                minifyEnabled false
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Origin-scoped WebView message channel for exporting local JSON/XML files.
dependencies {
    implementation 'androidx.webkit:webkit:1.18.0'
}

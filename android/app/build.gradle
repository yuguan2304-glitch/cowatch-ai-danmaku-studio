plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.cowatch.player'
    compileSdk 35

    def offlineBundle = project.hasProperty('cowatchOffline') && project.property('cowatchOffline') == 'true'

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId offlineBundle ? 'dev.cowatch.player.alpha.stable2026' : 'dev.cowatch.player'
        buildConfigField 'boolean', 'OFFLINE_BUNDLE', offlineBundle ? 'true' : 'false'
        resValue 'string', 'cowatch_app_name', offlineBundle ? '共映 Alpha 安全测试' : '共映 CoWatch'
        minSdk 26
        targetSdk 34
        versionCode Integer.parseInt(System.getenv('COWATCH_VERSION_CODE') ?: '2')
        versionName System.getenv('COWATCH_VERSION_NAME') ?: '0.2.5-alpha'
    }

    // Debug builds MUST explicitly sign with the restored CI keystore.
    // AGP's implicit debug signing may otherwise silently use a different key,
    // causing Android INSTALL_FAILED_UPDATE_INCOMPATIBLE.
    signingConfigs {
        debug {
            storeFile file(System.getenv('HOME') + '/.android/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    // Production signing is only configured inside a protected GitHub Action.
    // The keystore and passwords must never be committed or printed in logs.
    if (System.getenv('COWATCH_KEYSTORE_PATH') &&
        System.getenv('COWATCH_KEYSTORE_PASSWORD') &&
        System.getenv('COWATCH_KEY_ALIAS') &&
        System.getenv('COWATCH_KEY_PASSWORD')) {
        signingConfigs {
            release {
                storeFile file(System.getenv('COWATCH_KEYSTORE_PATH'))
                storePassword System.getenv('COWATCH_KEYSTORE_PASSWORD')
                keyAlias System.getenv('COWATCH_KEY_ALIAS')
                keyPassword System.getenv('COWATCH_KEY_PASSWORD')
            }
        }
        buildTypes {
            release {
                signingConfig signingConfigs.release
                minifyEnabled false
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Origin-scoped WebView message channel for exporting local JSON/XML files.
dependencies {
    implementation 'androidx.webkit:webkit:1.18.0'
}

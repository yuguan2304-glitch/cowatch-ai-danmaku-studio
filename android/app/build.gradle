plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.cowatch.player'
    compileSdk 35

    defaultConfig {
        applicationId 'dev.cowatch.player'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '0.1.0-alpha'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
